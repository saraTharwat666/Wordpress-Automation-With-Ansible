---
# Installing LAMP stack
- name: Install LAMP Stack packages
  package:
    name:
      - httpd      # Web Server
      - mariadb-server # Database
      - php
      - php-mysqlnd 
      - php-gd      
    state: present

# start the Services
- name: Start Apache and MariaDB services
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - httpd
    - mariadb


# Create Database Config 
- name: Create WordPress database
  mysql_db:
    name: wordpress_db
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock

# Create user for DB
- name: Create database user for WordPress
  mysql_user:
    name: wp_user
    password: "YourStrongPassword"
    priv: 'wordpress_db.*:ALL'
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock

# Download wordpress Files 
- name: Download WordPress
  get_url:
    url: https://wordpress.org/latest.tar.gz
    dest: /tmp/wordpress.tar.gz

# Unarchive file
- name: Extract WordPress files
  unarchive:
    src: /tmp/wordpress.tar.gz
    dest: /var/www/html
    remote_src: yes

# Edit the Permissions
- name: Set ownership for WordPress directory
  file:
    path: /var/www/html
    owner: apache
    group: apache
    recurse: yes


- name: Configure WordPress with wp-config.php
  template:
    src: wp-config.php.j2
    dest: /var/www/html/wp-config.php
    owner: apache
    group: apache
    mode: '0644'
  notify: restart apache